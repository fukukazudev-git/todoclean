# DB接続情報は環境変数で上書き可能にする（${変数名:既定値} → 変数が無ければ既定値を使用）
# Docker起動時は docker-compose から SPRING_DATASOURCE_* を注入する。
# ローカル単体実行（mvnw）時は既定値が使われ、従来どおり localhost に接続する。
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/todo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:todo_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# data.sql を Hibernate のテーブル生成後に実行させる設定
# （これが無いとテーブル作成前にdata.sqlが走り失敗する）
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleafの設定
spring.mvc.hiddenmethod.filter.enabled=true
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false