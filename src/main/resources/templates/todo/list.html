<!DOCTYPE html>
<htmlxmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Todo 一覧</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <h2 class="mb-4">Todo 一覧</h2>
    <table class="table table-striped table-hover">
        <thred class="table-dark">
            <tr>
                <th>ID</th>
                <th>タイトル</th>
                <th>完了</th>
                <th>操作</th>
            </tr>
        </thred>

        <tbody>
            <tr th:each="todo : ${todos}">
                <td th:text="${todo.id}"></td>
                <td th:text="${todo.title}"></td>
                <td>
                    <span th:text="${todo.done ? '✓' : ''}"></span>
                </td>
                <td>
                    <a th:href="@{'/todo/' + ${todo.id} + '/edit'}" class="btn btn-sm  btn-primary me-2">編集</a>
                    <form th:action="@{'/todo' + ${todo.id}}" method="post" class="d-inline">
                        <input type="hidden" name="_method" value="delete">
                        <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('本当に削除しますか？');">削除</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    
    <a href="todo/create" class="btn btn-success" >新規作成</a>
</div>

</body>
