<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>

<header th:replace="~{layout :: header}"></header>
<div class="container">
    <h2 class="mb-4">Todo 一覧</h2>

    <div class="d-flex align-items-center mb-3">

        <!-- 検索フォーム -->
        <form method="get" class="d-flex" th:action="@{/todo}" style="max-width: 400px; height: 40px;">
            <input type="text" name="keyword" class="form-control me-2"
                placeholder="タイトルで検索" th:value="${keyword}">
            <button type="submit" class="btn btn-outline-primary me-2" style="width: 150px;">
                <i class="fa-solid fa-magnifying-glass"></i>検索
            </button>
            <a th:href="@{/todo(sort=${sort}, order=${order})}"
            class="btn btn-outline-secondary" style="width: 110px;">
                クリア
            </a>

            <input type="hidden" name="sort" th:value="${sort}">
            <input type="hidden" name="order" th:value="${order}">
        </form>

        <!-- ソートドロップダウン -->
        <div class="dropdown ms-3">
            <button class="btn btn-outline-secondary dropdown-toggle"
                    type="button" data-bs-toggle="dropdown">
                並び替え
            </button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item"
                    th:href="@{/todo(sort='createdAt', order='desc', keyword=${keyword})}">
                    作成日時（新しい順）
                </a></li>
                <li><a class="dropdown-item"
                    th:href="@{/todo(sort='createdAt', order='asc', keyword=${keyword})}">
                    作成日時（古い順）
                </a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item"
                    th:href="@{/todo(sort='title', order='asc', keyword=${keyword})}">
                    タイトル（昇順）
                </a></li>
                <li><a class="dropdown-item"
                    th:href="@{/todo(sort='title', order='desc', keyword=${keyword})}">
                    タイトル（降順）
                </a></li>
            </ul>
        </div>

    </div>


    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>
                    タイトル
                    <a th:href="@{/todo(sort='title', order=${order == 'asc' ? 'desc' : 'asc'}, keyword=${keyword})}" class="text-decoration-none">
                        <span th:if="${order == 'asc'}">▴</span>
                        <span th:if="${order == 'desc'}">▾</span>
                    </a>
                </th>
                <th>完了</th>
                <th>詳細</th>
                <th>作成日時</th>
                <th>操作</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="todo : ${todos}">
                <td th:text="${todo.title}"></td>
                <td>
                    <span th:text="${todo.done ? '✓' : ''}"></span>
                </td>
                <td style="max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"
                    th:title="${todo.description}">
                    <span th:text="${#strings.abbreviate(todo.description, 30)}"></span>
                </td>
                <td th:text="${#temporals.format(todo.createdAt, 'yyyy-MM-dd HH:mm')}"></td>

                <td>
                    <a th:href="@{'/todo/' + ${todo.id} + '/edit'}"
                       class="btn btn-sm btn-primary me-2">
                       <i class="fa-solid fa-pen"></i>編集
                    </a>

                    <form th:action="@{'/todo/' + ${todo.id}}" method="post" class="d-inline">
                        <input type="hidden" name="_method" value="delete">
                        <button type="submit" class="btn btn-sm btn-danger"
                                onclick="return confirm('本当に削除しますか？');">
                                <i class="fa-solid fa-trash"></i>削除
                        </button>
                    </form>
                </td>

            </tr>
        </tbody>
    </table>

    <a href="/todo/create" class="btn btn-success">
        <i class="fa-solid fa-plus"></i>新規作成
    </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
