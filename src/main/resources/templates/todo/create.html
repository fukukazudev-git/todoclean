<!DOCTYPE html>
<html 
    xmlns:th="http://www.thymeleaf.org"
>
<head 
    th:replace="~{layout :: head}"
>
</head>
<body>

<header 
    th:replace="~{layout :: header}"
>
</header>

<div 
    class="container mt-4" 
    style="max-width: 600px"
>
    <div 
        class="card shadow-sm p-4"
    >
        <div 
            class="card-header bg-secondary-subtle"
        >
            <i 
                class="fa-solid fa-pen"
            >
            </i> 
            Todo 新規作成
        </div>

        <div 
            class="card-body"
        >

            <form 
                th:action="@{/todo/create}" 
                method="post" 
                th:object="${form}" 
                class="mt-4"
            >

                <div 
                    class="mb-3"
                >
                    <label 
                        class="form-label"
                    >
                        <i 
                            class="fa-solid fa-tag"
                        >
                        </i>
                        タイトル
                    </label>
                    <input 
                        type="text" 
                        th:field="*{title}" 
                        class="form-control" 
                        th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                    >
                    <div 
                        class="invalid-feedback" 
                        th:errors="*{title}"
                    >
                    </div>
                </div>
                <div 
                    class="mb-3"
                >
                    <label 
                        for="description" 
                        class="form-label"
                    >
                        詳細
                    </label>
                    <textarea 
                        id="description"
                        th:field="*{description}"
                        class="form-control"
                        th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                        style="height: 120px"
                    >
                    </textarea>
                    
                    <div 
                        class="invalid-feedback" 
                        th:if="${#fields.hasErrors('description')}"
                        th:errors="*{description}"
                    >
                    </div>
                </div>

                <div 
                    class="form-check mb-3"
                >
                    <input 
                        type="checkbox" 
                        th:field="*{done}" 
                        class="form-check-input"
                    >
                    <label 
                        class="form-check-label"
                    >
                        完了
                    </label>
                </div>
                <input type="hidden" name="sort"    th:value="${sort}">
                <input type="hidden" name="order"   th:value="${order}">
                <input type="hidden" name="keyword" th:value="${keyword}">
                <input type="hidden" name="filter"  th:value="${filter}">
                <input type="hidden" name="page"    th:value="${page}">

                <div
                    class="card-footer text-end"
                >
                    <a 
                        th:href="
                            @{/todo( 
                                sort=${sort}, 
                                order=${order},
                                keyword=${keyword}, 
                                filter=${filter},
                                page=${page}
                            )}
                        " 
                        class="btn btn-secondary"
                    >
                        戻る
                    </a>
                    <button 
                        type="submit" 
                        class="btn btn-primary"
                    >
                        作成
                    </button>
                </div>
        
            </form>

        </div>
    </div>
</div>

</body>
</html>
