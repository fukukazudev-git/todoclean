<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>

<header th:replace="~{layout :: header}"></header>

<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-secondary-subtle">
            <i class="fa-solid fa-pen"></i> Todo 新規作成
        </div>

        <div class="card-body">

            <form th:action="@{/todo/create}" method="post" th:object="${form}" class="mt-4">

                <div class="mb-3">
                    <label class="form-label">
                        <i class="fa-solid fa-tag"></i>タイトル
                    </label>
                    <input type="text" th:field="*{title}" class="form-control" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{title}"></div>
                </div>

                <div class="form-check mb-3">
                    <input type="checkbox" th:field="*{done}" class="form-check-input">
                    <label class="form-check-label">完了</label>
                </div>
                <div class="card-footer text-end">
                    <button type="submit" class="btn btn-primary">作成</button>
                </div>
                <a href="/todo" class="btn btn-secondary mt-3">
                    <i class="fa-solid fa-arrow-left"></i>一覧に戻る
                </a>
            </form>

        </div>
    </div>
</div>

</body>
</html>
