<!DOCTYPE html>
<html xmlns:th="http.//www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Todo 新規作成</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<h1>Todo 新規作成</h1>

<form th:action="@{/todo/create}" method="post" th:object="${form}" class="mt-4">

    <div class="mb-3">
        <label class="form-label">タイトル</label>
        <!-- is-invalid →入力欄を赤枠にするクラス -->
        <input type="text" th:field="*{title}" class="form-control" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
        <!-- invalid-feedback →エラーテキストを表示するクラス -->
        <div class="invalid-feedback" th:errors="*{title}"></div>
    </div>
    <!-- Bootstrapのフォームは余白クラスを使用することで自然に上下のスペースが確保される -->
    <!-- 実務では<br>を使用することは少ない。→レイアウトはCSSで管理するため -->
    
    <div class="form-check mb-3">
        <input type="checkbox" th:field="*{done}" class="form-check-input">
        <label class="form-check-label">完了</label>
    </div>

    <button type="submit">作成</button>

</form>

</body>
</html>
