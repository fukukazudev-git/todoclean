<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Todo 編集</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<h1>Todo 編集</h1>

<form th:action="@{'/todo/' + ${todo.id}}" method="post" th:object="${todo}" class="mt-4">
    <!-- PUT メソッドに変換-->
    <input type="hidden" name="_method" value="put">
    
    <!-- hidden で埋め込む -->
    <input type="hidden" th:field="*{id}">
    <input type="hidden" th:field="*{version}">

    <!-- タイトルと完了の入力欄 -->
    <div class="mb-3">
        <label class="form-label">タイトル</label>
        <input type="text" th:field="*{title}" class="form-control" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
        <div class="invalid-feedback" th:errors="*{title}"></div>
    </div>

    <div class="form-check mb-3">
        <input type="checkbox" th:field="*{done}" class="form-check-input">
        <label class="form-check-label">完了</label>
    </div>

    <button type="submit">更新</button>
</form>

</body>
</html>
